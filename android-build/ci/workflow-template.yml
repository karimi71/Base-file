name: Audit offline Android toolchain inputs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/base-file-gradle-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Install exact SDK inputs
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-34' \
            'build-tools;34.0.0'
          du -sh "$ANDROID_HOME/platforms/android-34" "$ANDROID_HOME/build-tools/34.0.0"
          find "$ANDROID_HOME/platforms/android-34" -type f | wc -l
          find "$ANDROID_HOME/build-tools/34.0.0" -type f | wc -l

      - name: Build real Compose smoke APK online
        shell: bash
        run: |
          set -euxo pipefail
          gradle --version
          gradle -p android-build/compose-smoke-test --no-daemon --stacktrace :app:assembleDebug
          APK=android-build/compose-smoke-test/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Audit exact downloaded module set
        shell: bash
        run: |
          set -euxo pipefail
          du -sh "$GRADLE_USER_HOME/caches/modules-2" || true
          du -sh "$GRADLE_USER_HOME/caches/modules-2/files-2.1"/* 2>/dev/null | sort -h
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1" -type f -printf '%s %p\n' | sort -nr | head -80

      - name: Exercise a compact JDK 17 image
        shell: bash
        run: |
          set -euxo pipefail
          MODULES='java.base,java.compiler,java.desktop,java.instrument,java.logging,java.management,java.management.rmi,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml,java.xml.crypto,jdk.compiler,jdk.crypto.cryptoki,jdk.crypto.ec,jdk.jartool,jdk.jdeps,jdk.jfr,jdk.jlink,jdk.localedata,jdk.management,jdk.naming.dns,jdk.naming.rmi,jdk.net,jdk.security.auth,jdk.security.jgss,jdk.unsupported,jdk.unsupported.desktop,jdk.zipfs'
          "$JAVA_HOME/bin/jlink" \
            --add-modules "$MODULES" \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2 \
            --output "$RUNNER_TEMP/jdk17-gradle"
          du -sh "$RUNNER_TEMP/jdk17-gradle"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/jdk17-gradle-linux-x64.tar.gz" jdk17-gradle
          ls -lh "$RUNNER_TEMP/jdk17-gradle-linux-x64.tar.gz"
          JAVA_HOME="$RUNNER_TEMP/jdk17-gradle" \
            gradle -p android-build/compose-smoke-test --no-daemon :app:assembleDebug
